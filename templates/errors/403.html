{% extends 'registration/registration_base.html' %}
{% load i18n %}

{% block title %}403 | Forbidden{% endblock %}

{% block content %}
<div class="d-flex justify-content-center align-items-center min-vh-100 bg-light">

  <div class="card shadow p-5 text-center" style="max-width: 450px; width: 100%;">

    <h1 class="text-warning fw-bold">403</h1>

    <h4>{% trans "Access Denied" %}</h4>

    <p class="text-muted">
      {% trans "You don’t have permission to access this page." %}
    </p>

    <a href="{% url 'login' %}" class="btn btn-primary w-100">
      {% trans "Go Back" %}
    </a>

  </div>

</div>
{% endblock %}
