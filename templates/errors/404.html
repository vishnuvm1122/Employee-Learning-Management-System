{% extends 'registration/registration_base.html' %}
{% load i18n %}

{% block title %}404 | Page Not Found{% endblock %}

{% block content %}
<div class="d-flex justify-content-center align-items-center min-vh-100 bg-light">

  <div class="card shadow p-5 text-center" style="max-width: 450px; width: 100%; border-radius: 16px;">

    <h1 class="text-danger fw-bold">404</h1>

    <h4 class="mb-3">{% trans "Page Not Found" %}</h4>

    <p class="text-muted mb-4">
      {% trans "The page you are looking for does not exist or has been moved." %}
    </p>

    <a href="{% url 'login' %}" class="btn btn-primary w-100">
      {% trans "Go to Home" %}
    </a>

  </div>

</div>
{% endblock %}
